# =============================================================================
# Multi-Turn I2V ODE-Init Pretraining Config
# 用来在走 DMD 蒸馏（[`configs/multi_turn_dmd_distill_config.yaml`](configs/multi_turn_dmd_distill_config.yaml:1)）
# 之前，先用 ODE regression loss 把多轮 causal 模型预热到少步 timestep 上。
#
# 训练逻辑（与 trainer/multi_turn_ode_init.py 对应）：
#   1. 取一条多轮 batch -> [B, T, C, H, W]，T = 1 + N_turns
#   2. 同步采样目标 turn k ∈ [1, T-1]
#   3. no_grad self-rollout 出 history，prefill KV cache 到 k-1
#   4. 在 k 位置采样一个 denoising step idx，做 backward simulation 拿到
#      noisy_input_k，单步 forward generator -> pred_x0_k（带梯度）
#   5. loss = MSE(pred_x0_k, GT clean_k)
#
# 产出 ckpt 路径示例：
#   logs/multi_turn_ode_init_4step_14b/ckpt/checkpoint_001000/model.pt
# 随后把这个路径填到 DMD config 的 checkpoint.pretrained_pt 即可。
# =============================================================================

# 训练 flags（与 DMD 保持一致的字段命名）
distribution_loss: "ode"
i2v: false
causal: true
mixed_precision: true

# ODE init 使用的少步 schedule（与 DMD 蒸馏阶段完全对齐）
denoising_step_list: [1000, 750, 500, 250]
warp_denoising_step: false

# Scheduler
num_train_timestep: 1000
timestep_shift: 1.0

# AR 回写 KV cache 时给 history latent 的 timestep（与 DMD 一致）
context_noise: 0
same_step_across_blocks: true

# Generator 架构相关（保持和多轮训练 / DMD 完全一致）
num_frame_per_block: 1
independent_first_frame: true
gradient_checkpointing: true
last_step_only: true
num_training_frames: 21

# Training schedule
batch_size: 1
gradient_accumulation_steps: 1
num_workers: 1
max_steps: 50000
log_iters: 1
save_iters: 500
gc_interval: 50
no_save: false
no_visualize: true
load_raw_video: false
disable_wandb: true

# Optim（ODE init 通常学习率可以比 DMD 略高，因为是有监督 MSE）
lr: 5.0e-6
beta1: 0.9
beta2: 0.999
weight_decay: 0.01
max_grad_norm_generator: 10.0

# EMA（ODE init 阶段一般不开）
ema_weight: 0.0

# FSDP
sharding_strategy: "full"
generator_fsdp_wrap_strategy: "size"
text_encoder_fsdp_wrap_strategy: "size"
text_encoder_cpu_offload: true

# CPU offload（ODE init 只有 generator 一个大模型，显存相对 DMD 宽裕很多）
generator_cpu_offload: false
vae_cpu_offload: true

# Data（与多轮训练 / DMD 使用相同的多轮数据集）
data:
  data_path: "/path/to/your/multi_turn_data.json"
  image_size: [1024, 1024]
  max_turns: 5
  # 严格模式：要求样本 num_turns == max_turns，与 DMD trainer 一致，
  # 避免多 rank FSDP self-rollout 调用次数不齐。
  require_exact_turns: true
  bucket_step_width: 64
  bucket_step_height: 64
  bucket_max_ratio: 4.0

# Logging
config_name: "multi_turn_ode_init_4step_14b"
logdir: "./logs/multi_turn_ode_init_4step_14b/ckpt"
tensorboard_logdir: "./logs/multi_turn_ode_init_4step_14b/tensorboard"
enable_tensorboard: true

# System
seed: 42
num_gpus: 8
compile: false

# Checkpoint
checkpoint:
  # 已经训练好的多轮 causal 编辑模型（ODE init 以此为起点）
  pretrained_pt: /path/to/stage2_checkpoint/model.pt
  # 是否优先从 ckpt["generator_ema"] 加载（推理路径用的就是 EMA，初始化以
  # EMA 为起点更贴近真实部署效果，下游蒸馏也更稳）。找不到 ema 时自动回落
  # 到 ckpt["generator"]。
  prefer_ema: true
  # 单独覆盖 generator ckpt（可选，用于 resume；resume 时强制走实时权重）
  generator_ckpt: null
  rank0_only_load: true
  no_save: false
  no_visualize: true

# Generator 模型参数（与多轮训练 / DMD 完全一致）
model_kwargs:
  model_name: /path/to/Wan2.1-T2V-14B
  timestep_shift: 1.0
  is_causal: true
  local_attn_size: -1
  sink_size: 0
  model_type: "t2v"
  num_frame_per_block: 1
  independent_first_frame: true
  cross_attn_current_prompt_only: true
  temporal_rope_stride: 4